<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Little Study Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Layout: soft pastel arcade windows. Garden page = one floating isometric plot with a slim progress strip. Syllabus page = dashboard, timetable, sheet, list. */
:root{
  color-scheme:light;
  --bg:#FFF3F9; --bg2:#F1F3FF; --surface:#FFFFFF; --surface2:#FFF8FC;
  --ink:#6B4A68; --ink2:#86687F; --line:#E3C4DD; --sh:#F0D9EA;
  --pink:#FFB9D8; --pink-deep:#EE7FB0; --btn-ink:#6B3A62; --focus:#D4609F;
  --lav:#E1D6FF; --sky:#D3EAFF; --mint:#D4F5E2; --butter:#FFF3B8;
  --sky1:#E6F3FF; --sky2:#FFEAF5;
  --grass1:#CFF3DA; --grass2:#C3EED1; --side1:#FFC6E0; --side2:#F6AECD; --blob:#B58FB0;
  --t1:#FFD9EB; --t2:#E6DAFF; --t3:#D3EBFF; --t4:#D6F5E1; --t5:#FFF5BF; --t6:#FFE0D2; --t7:#CFF5EF; --t8:#EAF7C6;
  --rot1:#F0E8B8; --rot2:#E3D2BE;
  --c-done:#8EDDB0; --c-todo:#CDBBFF; --c-over:#FFA3B5; --track:#F6E8F2;
  --display:'Bagel Fat One','Chalkboard SE','Comic Sans MS',cursive,sans-serif;
  --body:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --hud:'Silkscreen','Courier New',monospace;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  background-image:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45;
  cursor:var(--cur,auto);
  padding-block:18px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,textarea{font:inherit;color:inherit}
button,.tile,.filebtn,label.btn,input[type=checkbox],input[type=date]::-webkit-calendar-picker-indicator{cursor:var(--cur-p,pointer)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
svg{display:block}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{min-width:0}
h1{margin:0;font:400 clamp(32px,6vw,50px)/1 var(--display);color:var(--pink-deep);letter-spacing:.5px;text-shadow:0 3px 0 #FFE0EF}
.tag{margin:8px 0 0;font:400 11px var(--hud);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{font-weight:600;font-size:14px;color:var(--ink);background:var(--surface);border:2px solid var(--line);
  border-radius:999px;padding:7px 16px;box-shadow:0 3px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--sh)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
.btn.pink{background:linear-gradient(#FFD0E6,var(--pink));color:var(--btn-ink)}
.btn.small{padding:4px 12px;font-size:13px}
.btn.danger{background:var(--surface2)}
.btn[aria-pressed="true"].tg{background:var(--mint)}

.switch{display:flex;gap:8px}
.sw{flex:none;font:400 15px var(--display);letter-spacing:.3px;background:var(--surface);color:var(--ink2);border:2px solid var(--line);border-radius:999px;padding:7px 22px;box-shadow:0 3px 0 var(--sh)}
.sw[aria-current="true"]{background:linear-gradient(90deg,#FFD0E6,#E1D6FF);color:var(--btn-ink)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--butter);color:#6B5A2E;border:2px dashed #E8D58A;border-radius:16px;padding:8px 14px;font-weight:500}

.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:thin}
.chip-t{flex:none;display:flex;align-items:center;gap:8px;font-weight:600;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 var(--sh);white-space:nowrap}
.chip-t .n{font:400 10px var(--hud);color:var(--ink2);letter-spacing:.04em}
.chip-t[aria-current="true"]{background:linear-gradient(#FFD0E6,var(--pink));color:var(--btn-ink)}
.chip-t[aria-current="true"] .n{color:var(--btn-ink)}
.chip-t.all{background:linear-gradient(90deg,var(--lav),var(--sky));color:var(--btn-ink)}
.chip-t.all .n{color:var(--btn-ink)}
.chip-t.all[aria-current="true"]{background:linear-gradient(90deg,#FFD0E6,#D9CBFF,#BFE2FF)}
.chip-t.add{border-style:dashed;box-shadow:none;background:transparent}

.win{border:2px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:0 6px 0 var(--sh);overflow:hidden;min-width:0}
.win-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;color:var(--btn-ink);background:linear-gradient(90deg,#FFD6EA,#E4D8FF 55%,#D3EAFF);border-bottom:2px solid var(--line)}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line);display:block}
.win-title{font:400 12px var(--hud);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.stage{position:relative;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.stage svg.plot{width:100%;height:auto;max-height:76vh;margin:0 auto}
.empty-note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:0 4px 0 var(--sh);max-width:min(320px,86%)}
.empty-note b{display:block;font:400 22px var(--display);color:var(--pink-deep);margin-bottom:4px}
.empty-note .actions{justify-content:center;margin-top:10px}

.g1{fill:var(--grass1)} .g2{fill:var(--grass2)}
.side-l{fill:var(--side1)} .side-r{fill:var(--side2)}
.slab-line{stroke:#E9B5D3;stroke-width:2.5;stroke-linejoin:round;fill:none}
.tile-edge{stroke:rgba(255,255,255,.55);stroke-width:1.5}
.hit{fill:transparent;stroke:transparent;stroke-width:3;pointer-events:all}
.tile{outline:none}
.tile:hover .hit,.tile.hl .hit{stroke:var(--pink-deep);stroke-width:3.5}
.tile.sel .hit{stroke:var(--pink-deep);stroke-width:5}
.tile:focus-visible .hit{stroke:var(--focus);stroke-width:5}
.sway{transform-origin:0 0;animation:sway 3.8s ease-in-out infinite alternate}
.pop{transform-origin:0 0;animation:pop .7s cubic-bezier(.3,1.7,.5,1)}
.spk{fill:#FFF3A0;stroke:#E2B6D6;stroke-width:1.2;animation:spk .9s ease-out forwards}
.warn-tag{font:400 22px var(--display);fill:#F2748F;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes pop{from{transform:scale(.1)}to{transform:scale(1)}}
@keyframes spk{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@keyframes trail{from{transform:translate(0,0) scale(1);opacity:.95}to{transform:translate(var(--tx),var(--ty)) scale(.2);opacity:0}}
.trail{position:fixed;z-index:200;width:12px;height:12px;pointer-events:none;margin:-6px 0 0 -6px;animation:trail .7s ease-out forwards;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@media (prefers-reduced-motion:reduce){.sway,.pop,.spk,.trail{animation:none}.spk,.trail{display:none}}

.bubble{position:absolute;z-index:5;width:min(290px,calc(100% - 16px));background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--sh);padding:12px 14px}
.bubble .x{position:absolute;right:8px;top:6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);line-height:1;padding:0;font-size:16px}
.b-top{display:flex;gap:10px;align-items:center;padding-right:26px}
.b-ico{width:54px;height:64px;flex:none;background:var(--surface2);border-radius:14px;border:2px solid var(--line)}
.b-name{font-weight:600;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.b-sub{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.pill{display:inline-block;margin:8px 6px 2px 0;font:400 10px var(--hud);letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface2)}
.pill.on{background:var(--mint)} .pill.bad{background:#FFDCE3} .pill.soon{background:var(--butter)}
.b-due{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;font-weight:600}
.b-due input{width:auto;flex:1}
.b-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:10px;max-height:160px;overflow:auto;padding:2px}
.pk{border:2px solid var(--line);border-radius:12px;background:var(--surface2);padding:2px}
.pk[aria-pressed="true"]{background:var(--pink);box-shadow:0 2px 0 var(--sh)}
.pk svg{width:100%;height:auto}

/* hud strip */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--sh);padding:10px 14px}
.lv{font:400 12px var(--hud);letter-spacing:.06em;background:var(--butter);color:#6B5A2E;border-radius:8px;padding:3px 8px}
.rank{font:400 20px var(--display);color:var(--pink-deep)}
.bar{flex:1 1 180px;min-width:120px;height:18px;border:2px solid var(--line);border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(-45deg,#FFB3D6 0 10px,#FFCFE5 10px 20px);transition:width .5s}
.hud-n{font-size:14px;color:var(--ink2)} .hud-n b{font:400 18px var(--display);color:var(--ink)}
.hearts{display:flex;gap:3px;align-items:center}
.hearts svg{width:18px;height:18px}
.hh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}

/* syllabus */
.sub-tabs{display:flex;gap:8px;flex-wrap:wrap}
.st{border:2px solid var(--line);border-radius:999px;background:var(--surface);padding:5px 16px;font-weight:600;font-size:14px;box-shadow:0 3px 0 var(--sh)}
.st[aria-selected="true"]{background:var(--pink);color:var(--btn-ink)}
.panel{display:flex;flex-direction:column;gap:14px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile-k{background:var(--surface);border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--sh);padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.tile-k .k{font:400 10px var(--hud);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.tile-k .v{font:400 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile-k.good{background:var(--mint)} .tile-k.bad{background:#FFE3E9} .tile-k.soon{background:var(--butter)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--sh);padding:14px;min-width:0}
.card h3{margin:0 0 10px;font:400 17px var(--display);color:var(--pink-deep)}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px}
.sw-c{width:14px;height:14px;border-radius:5px;display:block;border:2px solid rgba(107,74,104,.25)}
.legend b{font-variant-numeric:tabular-nums}
.sb{display:flex;flex-direction:column;gap:10px}
.sb-r{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.sb-n{overflow-wrap:anywhere;font-weight:500}
.sb-bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--track);border:2px solid var(--line)}
.sb-bar i{display:block;height:100%}
.sb-v{font:400 11px var(--hud);color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:10px}
.keyrow span{display:flex;align-items:center;gap:6px}
.nl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.nl li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:6px 12px;flex-wrap:wrap}
.nl .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.nl .nm small{display:block;color:var(--ink2);font-size:12px;font-weight:400}
.badge{font:400 10px var(--hud);letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--lav);white-space:nowrap}
.badge.bad{background:#FFDCE3} .badge.soon{background:var(--butter)} .badge.ok{background:var(--mint)}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
table.tt,table.sheet{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.tt th,.tt td,.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tt th,.sheet th{background:var(--lav);color:var(--btn-ink);font:400 11px var(--hud);letter-spacing:.04em;position:sticky;top:0;white-space:nowrap}
.tt th.now{background:var(--pink)}
.tt td.rowh,.tt th.rowh{position:sticky;left:0;background:var(--surface2);font-weight:600;min-width:120px;max-width:160px;z-index:1}
.tt th.rowh{background:var(--lav);z-index:2}
.tt td{min-width:120px}
.tt td.cellnow{background:#FFF8FC}
.chips{display:flex;flex-direction:column;gap:4px}
.uc{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:3px 8px;font-size:12.5px;line-height:1.3;background:var(--c-todo);overflow-wrap:anywhere}
.uc.done{background:var(--c-done);text-decoration:line-through;text-decoration-thickness:1.5px}
.uc.overdue{background:var(--c-over)}
.uc small{display:block;font-size:11px;opacity:.8}
.sheet td{background:var(--surface)}
.sheet tr:nth-child(even) td{background:var(--surface2)}
.sheet td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet input[type=date]{padding:3px 8px;border-radius:8px;font-size:13px}
.ck-b{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ck-b[aria-pressed="true"]{background:var(--pink)}
.ck-b[aria-pressed="true"]::after{content:"";width:6px;height:11px;border:solid var(--btn-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.subjs{display:flex;flex-direction:column;gap:10px}
.gh{margin:4px 2px 0;font:400 11px var(--hud);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.sj{background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--sh);overflow:hidden}
.sj-h{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px}
.chip{width:16px;height:16px;border-radius:6px;border:2px solid var(--line);display:block;grid-row:1/3}
.sn{font-weight:600;overflow-wrap:anywhere}
.sc{font:400 11px var(--hud);color:var(--ink2);justify-self:end}
.mdots{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:transparent;display:block}
.dot.on{background:var(--c)}
.us{list-style:none;margin:0;padding:0 8px 8px;display:none;flex-direction:column;gap:5px}
.sj.open .us{display:flex}
.ur{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.ck{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center}
.ur[aria-pressed="true"] .ck{background:var(--pink)}
.ur[aria-pressed="true"] .ck::after{content:"";width:6px;height:10px;border:solid var(--btn-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ur[aria-pressed="true"] .ut{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1.5px}
.ut{flex:1;min-width:0;overflow-wrap:anywhere}
.none{color:var(--ink2);font-size:14px;margin:0}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(107,74,104,.35);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheetm{width:100%;max-width:780px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--sh);overflow:hidden}
.sheetm .win-bar{flex:none}
.mtabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
.mt{border:2px solid var(--line);border-radius:999px;background:var(--surface2);padding:4px 14px;font-weight:600;font-size:14px}
.mt[aria-selected="true"]{background:var(--pink);color:var(--btn-ink);box-shadow:0 3px 0 var(--sh)}
.mbody{padding:14px 16px 18px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.mbody h3{margin:0;font:400 19px var(--display);color:var(--pink-deep)}
.mbody p{margin:0;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
input[type=text],input[type=number],input[type=date],textarea{background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:7px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;font-size:13px}
.sjm{border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input[type=text]{flex:1 1 160px}
.row>input[type=date]{flex:0 0 150px;width:150px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px}
@media (max-width:520px){.addrow{grid-template-columns:minmax(0,1fr)}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.fk{border:2px solid var(--line);border-radius:14px;background:var(--surface2);padding:6px 4px;text-align:center;font-size:12px;font-weight:500}
.fk svg{width:44px;height:56px;margin:0 auto}
.fk[aria-pressed="true"]{background:var(--pink);color:var(--btn-ink);box-shadow:0 3px 0 var(--sh)}
.tbl{overflow-x:auto}
table.ex{border-collapse:collapse;font-size:13px;min-width:460px}
.ex th,.ex td{border:2px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap}
.ex th{background:var(--lav);color:var(--btn-ink);font:400 11px var(--hud);letter-spacing:.04em}
.msg{background:var(--mint);color:#2F6B4C;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:500}
.msg.warn{background:var(--butter);color:#6B5A2E}
.filebtn{display:inline-flex;position:relative}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.filebtn:focus-within{outline:3px solid var(--focus);outline-offset:2px;border-radius:999px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;font-weight:600;max-width:90%}
input[type=email],input[type=password]{background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:7px 11px;width:100%;min-width:0}
a.btn{text-decoration:none;display:inline-block}
.who{font-size:13px;color:var(--ink2);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:center}
body.ro .actions,body.ro .tg,body.ro .chip-t.add,body.ro .b-actions{display:none!important}

<script>
(function(){
'use strict';
var KEY='little-study-garden-v1';
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var uidn=0;
function uid(){return Date.now().toString(36)+(uidn++).toString(36)+Math.random().toString(36).slice(2,5);}

/* ---------- game cursor + sparkle trail ---------- */
(function(){
  function svg(fill){
    var s="<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'>"+
      "<path d='M5 3 L5 24 L10.5 19 L14.5 28 L19 26 L15 17.5 L22.5 17.5 Z' fill='white' stroke='white' stroke-width='6' stroke-linejoin='round'/>"+
      "<path d='M5 3 L5 24 L10.5 19 L14.5 28 L19 26 L15 17.5 L22.5 17.5 Z' fill='"+fill+"' stroke='#9C5A8C' stroke-width='2' stroke-linejoin='round'/>"+
      "<path d='M9 8 L9 15' stroke='white' stroke-width='2' stroke-linecap='round' opacity='.8'/>"+
      "<path d='M26 3 L27.4 6.6 L31 8 L27.4 9.4 L26 13 L24.6 9.4 L21 8 L24.6 6.6 Z' fill='%23FFF3A0' stroke='%239C5A8C' stroke-width='1.1' stroke-linejoin='round'/></svg>";
    return s.replace(/#/g,'%23').replace(/</g,'%3C').replace(/>/g,'%3E');
  }
  try{
    var r=document.documentElement.style;
    r.setProperty('--cur','url("data:image/svg+xml,'+svg('%23FFB9D8')+'") 5 3, auto');
    r.setProperty('--cur-p','url("data:image/svg+xml,'+svg('%23D9CBFF')+'") 5 3, pointer');
  }catch(e){}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var last=0,cols=['#FFB9D8','#D9CBFF','#BFE2FF','#FFF3A0'];
  document.addEventListener('pointermove',function(e){
    if(e.pointerType!=='mouse')return;
    var n=Date.now();if(n-last<70)return;last=n;
    var d=document.createElement('div');d.className='trail';
    d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';
    d.style.background=cols[Math.floor(Math.random()*cols.length)];
    d.style.setProperty('--tx',(Math.random()*24-12).toFixed(0)+'px');d.style.setProperty('--ty',(10+Math.random()*16).toFixed(0)+'px');
    document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},720);
  });
})();

/* ---------- dates ---------- */
var DAY=864e5;
function pad2(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function today0(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function pYMD(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
function addDays(n){var d=today0();d.setDate(d.getDate()+n);return ymd(d);}
function daysLeft(u){var d=pYMD(u.due);if(!d)return null;return Math.round((d-today0())/DAY);}
function fmtD(s){var d=pYMD(s);return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';}
function dueText(u){var n=daysLeft(u);if(n===null)return 'No deadline';if(n<0)return Math.abs(n)+(n===-1?' day late':' days late');if(n===0)return 'Due today';if(n===1)return 'Due tomorrow';return 'In '+n+' days';}
function stOf(u){if(u.done)return 'done';var n=daysLeft(u);return (n!==null&&n<0)?'overdue':'todo';}
function parseDate(v){
  v=String(v||'').trim();if(!v)return null;var m;
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(v)))return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.exec(v))){
    var a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;var dd=a,mm=b;if(b>12&&a<=12){dd=b;mm=a;}
    if(mm<1||mm>12||dd<1||dd>31)return null;return y+'-'+pad2(mm)+'-'+pad2(dd);}
  var t=Date.parse(v);if(!isNaN(t)){var d=new Date(t);return ymd(d);}
  return null;
}

/* ---------- flowers ---------- */
var OL='#A8678F';
var KINDS={
  tulipPink:{l:'Pink tulip',f:'tulip',c:'#FFA3CC',d:'#FFC8E1'},
  tulipLilac:{l:'Lilac tulip',f:'tulip',c:'#C3AEFF',d:'#DDD0FF'},
  tulipPeach:{l:'Peach tulip',f:'tulip',c:'#FFB8A0',d:'#FFD8C8'},
  tulipYellow:{l:'Yellow tulip',f:'tulip',c:'#FFDD78',d:'#FFEFAE'},
  daisy:{l:'Daisy',f:'daisy',c:'#FFFFFF',d:'#FFDC66'},
  sunflower:{l:'Sunflower',f:'sunflower',c:'#FFD65C',d:'#8A5A3B'},
  rose:{l:'Rose',f:'rose',c:'#FF86B3',d:'#FFA9C9'},
  sakura:{l:'Cherry blossom',f:'sakura',c:'#FFCFE3',d:'#FF9FC6'},
  lily:{l:'Lily',f:'lily',c:'#FFF6FA',d:'#FFAA8A'},
  lavender:{l:'Lavender',f:'lavender',c:'#B9A0FF',d:'#DACCFF'},
  hibiscus:{l:'Hibiscus',f:'hibiscus',c:'#FF8DB8',d:'#FFE585'},
  peony:{l:'Peony',f:'peony',c:'#FFC2DB',d:'#FF9CC4'},
  poppy:{l:'Poppy',f:'poppy',c:'#FF9486',d:'#8A5A7E'},
  forget:{l:'Forget-me-not',f:'forget',c:'#A3D4FF',d:'#FFEA85'}
};
var ORDER=['tulipPink','daisy','sakura','tulipLilac','rose','sunflower','lavender','tulipPeach','peony','poppy','lily','hibiscus','forget','tulipYellow'];
var TULIPS=['tulipPink','tulipLilac','tulipPeach','tulipYellow'];
function st(w){return 'stroke="'+OL+'" stroke-width="'+(w||1.4)+'" stroke-linejoin="round"';}
function ring(n,rx,ry,cy,fill,rot){var s='';rot=rot||0;for(var i=0;i<n;i++){s+='<ellipse cx="0" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" '+st(1.2)+' transform="rotate('+(rot+i*360/n).toFixed(1)+')"/>';}return s;}
function circ(r,fill,x,y,w){return '<circle cx="'+(x||0)+'" cy="'+(y||0)+'" r="'+r+'" fill="'+fill+'" '+st(w||1.2)+'/>';}
var STEM='<path d="M0 0 C-3 -20 3 -42 0 -62" fill="none" stroke="'+OL+'" stroke-width="7" stroke-linecap="round"/><path d="M0 0 C-3 -20 3 -42 0 -62" fill="none" stroke="#7CD9A5" stroke-width="4" stroke-linecap="round"/>';
var LEAF='<path d="M0 -14 C-6 -32 -26 -34 -30 -24 C-26 -12 -10 -8 0 -14Z" fill="#A3EBC0" '+st(1.5)+'/>';
var LEAVES=LEAF+'<g transform="translate(0 -14) scale(-1 1)">'+LEAF+'</g>';
function head(inner){return '<g transform="translate(0 -66)">'+inner+'</g>';}
var FAM={
  tulip:function(K){
    var lp='<path d="M-15 -80 C-17 -68 -12 -58 0 -56 C-2 -68 -6 -80 -8 -92 C-12 -90 -15 -86 -15 -80Z" fill="'+K.d+'" '+st()+'/>';
    return STEM+LEAVES+lp+'<g transform="scale(-1 1)">'+lp+'</g>'+
      '<path d="M-10 -80 C-12 -66 -6 -57 0 -56 C6 -57 12 -66 10 -80 C8 -90 3 -96 0 -98 C-3 -96 -8 -90 -10 -80Z" fill="'+K.c+'" '+st()+'/>';
  },
  daisy:function(K){return STEM+LEAVES+head(ring(14,4.6,11,-13,K.c)+circ(8,K.d));},
  sunflower:function(K){
    var dots='';for(var i=0;i<9;i++){var a=i/9*6.283;dots+='<circle cx="'+(Math.cos(a)*7).toFixed(1)+'" cy="'+(Math.sin(a)*7).toFixed(1)+'" r="1.3" fill="#C99468"/>';}
    return STEM+LEAVES+head(ring(18,4.2,12,-19,'#FFC866',10)+ring(18,4.2,12,-18,K.c)+circ(13,K.d)+dots+'<circle r="2" fill="#C99468"/>');
  },
  rose:function(K){
    return STEM+LEAVES+head(circ(21,K.c)+circ(15,K.d)+circ(9,K.c)+
      '<path d="M-6 1 C-7 -6 6 -7 6 0 C6 5 -3 6 -3 1" fill="none" '+st(1.4)+' stroke-linecap="round"/>'+
      '<path d="M-14 -8 C-10 -16 4 -18 12 -10" fill="none" '+st(1.2)+' stroke-linecap="round"/>');
  },
  sakura:function(K){
    var p='<path d="M0 0 C-10 -6 -12 -20 -5 -22 C-2 -22 0 -19 0 -17 C0 -19 2 -22 5 -22 C12 -20 10 -6 0 0Z" fill="'+K.c+'" '+st(1.3)+'/>';
    var s='',i;for(i=0;i<5;i++){s+='<g transform="rotate('+(i*72)+')">'+p+'</g>';}
    var st2='';for(i=0;i<6;i++){var a=i/6*6.283;st2+='<circle cx="'+(Math.cos(a)*6).toFixed(1)+'" cy="'+(Math.sin(a)*6).toFixed(1)+'" r="1.4" fill="'+K.d+'"/>';}
    return STEM+LEAVES+head(s+circ(3.5,K.d)+st2);
  },
  lily:function(K){
    var p='<path d="M0 0 C-8 -9 -7 -22 0 -32 C7 -22 8 -9 0 0Z" fill="'+K.c+'" '+st(1.3)+'/><path d="M0 -4 L0 -22" stroke="'+K.d+'" stroke-width="2" stroke-linecap="round"/>';
    var s='',i;for(i=0;i<3;i++){s+='<g transform="rotate('+(30+i*120)+')">'+p+'</g>';}
    for(i=0;i<3;i++){s+='<g transform="rotate('+(i*120)+')">'+p+'</g>';}
    var d='';for(i=0;i<6;i++){var a=i/6*6.283;d+='<circle cx="'+(Math.cos(a)*7).toFixed(1)+'" cy="'+(Math.sin(a)*7).toFixed(1)+'" r="2" fill="'+K.d+'" '+st(.8)+'/>';}
    return STEM+LEAVES+head(s+d);
  },
  lavender:function(K){
    var s='<path d="M0 0 C-2 -30 2 -60 0 -100" fill="none" stroke="'+OL+'" stroke-width="6.5" stroke-linecap="round"/><path d="M0 0 C-2 -30 2 -60 0 -100" fill="none" stroke="#7CD9A5" stroke-width="3.5" stroke-linecap="round"/>';
    s+='<g transform="translate(0 6)">'+LEAF+'</g><g transform="translate(0 -4) scale(-1 1)">'+LEAF+'</g>';
    for(var k=0;k<9;k++){var y=-52-k*5.4,f=k%2?K.d:K.c;
      s+='<ellipse cx="-4.5" cy="'+y+'" rx="4.4" ry="5.4" fill="'+f+'" '+st(1.1)+' transform="rotate(-18 -4.5 '+y+')"/><ellipse cx="4.5" cy="'+(y-2.5)+'" rx="4.4" ry="5.4" fill="'+f+'" '+st(1.1)+' transform="rotate(18 4.5 '+(y-2.5)+')"/>';}
    return s+'<ellipse cx="0" cy="-104" rx="3.6" ry="5.4" fill="'+K.c+'" '+st(1.1)+'/>';
  },
  hibiscus:function(K){
    return STEM+LEAVES+head(ring(5,12,15,-13,K.c)+circ(5.5,'#E8689C')+
      '<path d="M0 0 C4 -8 8 -14 10 -22" fill="none" stroke="#FFE585" stroke-width="2.4" stroke-linecap="round"/>'+
      circ(2.6,K.d,10,-22,1)+circ(2.6,K.d,6.5,-19,1)+circ(2.6,K.d,13,-18.5,1));
  },
  peony:function(K){
    return STEM+LEAVES+head(ring(9,9,11.5,-14,K.c)+ring(7,8,9,-9,K.d,20)+circ(9,K.c)+circ(5,K.d)+
      '<path d="M-6 -2 C-3 -7 3 -7 6 -2" fill="none" '+st(1.1)+' stroke-linecap="round"/>');
  },
  poppy:function(K){
    var d='';for(var i=0;i<8;i++){var a=i/8*6.283;d+='<circle cx="'+(Math.cos(a)*9).toFixed(1)+'" cy="'+(Math.sin(a)*9).toFixed(1)+'" r="1.4" fill="#6B4A68"/>';}
    return STEM+LEAVES+head(ring(4,13,14.5,-9,K.c,45)+circ(6.5,K.d)+d);
  },
  forget:function(K){
    function mini(x,y,s){var p='';for(var i=0;i<5;i++){p+='<circle cx="0" cy="-7.5" r="6.3" fill="'+K.c+'" '+st(1.1)+' transform="rotate('+(i*72)+')"/>';}
      return '<g transform="translate('+x+' '+y+') scale('+s+')">'+p+circ(3.6,K.d,0,0,1)+'</g>';}
    var br='';[[-17,-56],[2,-74],[18,-52]].forEach(function(p){
      br+='<path d="M0 -38 Q'+(p[0]*0.4)+' '+(p[1]+10)+' '+p[0]+' '+(p[1]+4)+'" fill="none" stroke="'+OL+'" stroke-width="5" stroke-linecap="round"/><path d="M0 -38 Q'+(p[0]*0.4)+' '+(p[1]+10)+' '+p[0]+' '+(p[1]+4)+'" fill="none" stroke="#7CD9A5" stroke-width="2.6" stroke-linecap="round"/>';});
    return '<path d="M0 0 L0 -38" stroke="'+OL+'" stroke-width="7" stroke-linecap="round"/><path d="M0 0 L0 -38" stroke="#7CD9A5" stroke-width="4" stroke-linecap="round"/>'+LEAVES+br+mini(-17,-56,.85)+mini(2,-74,1)+mini(18,-52,.8);
  }
};
function flowerBody(k){var K=KINDS[k]||KINDS.tulipPink;return FAM[K.f](K);}
function flowerIcon(k){return '<svg viewBox="-36 -108 72 114" aria-hidden="true">'+flowerBody(k)+'</svg>';}
var SPROUT='<ellipse cx="0" cy="2" rx="16" ry="6" fill="#C9A58B" opacity=".5"/><path d="M0 0 L0 -16" fill="none" stroke="'+OL+'" stroke-width="5.5" stroke-linecap="round"/><path d="M0 0 L0 -16" fill="none" stroke="#7CD9A5" stroke-width="3" stroke-linecap="round"/><path d="M0 -14 C-4 -26 -18 -26 -20 -19 C-17 -11 -6 -9 0 -14Z" fill="#A3EBC0" '+st(1.4)+'/><g transform="scale(-1 1)"><path d="M0 -14 C-4 -26 -18 -26 -20 -19 C-17 -11 -6 -9 0 -14Z" fill="#A3EBC0" '+st(1.4)+'/></g>';
var WILT='<ellipse cx="0" cy="2" rx="16" ry="6" fill="#C9A58B" opacity=".55"/><path d="M0 0 C0 -10 7 -16 14 -15" fill="none" stroke="'+OL+'" stroke-width="5.5" stroke-linecap="round"/><path d="M0 0 C0 -10 7 -16 14 -15" fill="none" stroke="#CFCB7E" stroke-width="3" stroke-linecap="round"/><path d="M2 -9 C-5 -13 -17 -9 -20 0 C-12 -2 -4 -3 2 -9Z" fill="#DDDA94" '+st(1.4)+'/><path d="M12 -15 C18 -14 25 -8 25 0 C19 -4 14 -7 12 -15Z" fill="#DDDA94" '+st(1.4)+'/>';
var DEAD='<ellipse cx="0" cy="2" rx="16" ry="6" fill="#B8957A" opacity=".6"/><path d="M0 0 C0 -6 5 -10 9 -8" fill="none" stroke="'+OL+'" stroke-width="5" stroke-linecap="round"/><path d="M0 0 C0 -6 5 -10 9 -8" fill="none" stroke="#BE9873" stroke-width="2.6" stroke-linecap="round"/><path d="M2 -5 C-5 -4 -15 0 -17 5 C-9 5 -1 3 2 -5Z" fill="#CDAA84" '+st(1.3)+'/><path d="M8 -8 C14 -6 20 -1 20 5 C14 3 10 0 8 -8Z" fill="#CDAA84" '+st(1.3)+'/>';

/* ---------- state ---------- */
var S={gardens:[],view:'all',rot:true};
var RO=false,USER=null,SB=null,R={token:null,t:null,status:''};
var UI={sel:null,pop:null,open:{},tab:'garden',pickerOpen:false,imp:null,armed:null,page:'garden',syl:'overview'};

function newGarden(name,picks){return {id:uid(),name:name,picks:(picks||ORDER).slice(),subjects:[],seq:0};}
function addUnit(g,s,name,done,kind,due){var u={id:uid(),name:name,done:!!done,kind:kind||null,due:due||null,n:g.seq++};s.units.push(u);return u;}
function makeSample(){
  var g=newGarden("Shally's garden");g.sample=true;
  [['Calculus',[['Limits and continuity',-20],['Differentiation',-12],['Integration',-6],['Infinite series',5]],3],
   ['Physics',[['Mechanics',-18],['Waves and optics',-9],['Thermodynamics',-3],['Electromagnetism',9]],2],
   ['Data structures',[['Arrays and lists',-7],['Trees',-1],['Graphs',4],['Hashing',11]],1],
   ['Contract law',[['Formation',-10],['Terms',-4],['Breach',2],['Remedies',13]],2],
   ['Psychology',[['Memory',1],['Learning',8],['Development',15],['Research methods',22]],0]
  ].forEach(function(x){var s={id:uid(),name:x[0],units:[]};g.subjects.push(s);
    x[1].forEach(function(un,i){addUnit(g,s,un[0],i<x[2],null,addDays(un[1]));});});
  return [g];
}
function lsKey(){return USER?KEY+':'+USER.id:KEY;}
function load(){
  try{var raw=localStorage.getItem(lsKey());if(raw){var d=JSON.parse(raw);if(d&&Array.isArray(d.gardens)){S.gardens=d.gardens;S.view=d.view||'all';S.rot=d.rot!==false;return;}}}catch(e){}
  S.gardens=makeSample();S.view=S.gardens[0].id;
}
function writeLocal(){try{localStorage.setItem(lsKey(),JSON.stringify({gardens:S.gardens,view:S.view,rot:S.rot}));}catch(e){}}
function save(){if(RO)return;writeLocal();if(USER)scheduleRemote();}
function curGarden(){return S.view==='all'?null:S.gardens.filter(function(g){return g.id===S.view;})[0]||null;}
function fixView(){if(S.view!=='all'&&!curGarden())S.view='all';}
function picksOf(g){return g.picks&&g.picks.length?g.picks:ORDER;}
function kindOf(g,u){return (u.kind&&KINDS[u.kind])?u.kind:picksOf(g)[(u.n||0)%picksOf(g).length];}
function rotOf(u){if(!S.rot||u.done)return 0;var n=daysLeft(u);if(n===null||n>=0)return 0;return n<=-3?2:1;}
function items(){
  var out=[],si=0,gs=S.view==='all'?S.gardens:S.gardens.filter(function(g){return g.id===S.view;});
  gs.forEach(function(g){g.subjects.forEach(function(sub){sub.units.forEach(function(u){out.push({u:u,sub:sub,g:g,si:si,kind:kindOf(g,u)});});si++;});});
  return out;
}
function findUnit(id){var r=null;S.gardens.forEach(function(g){g.subjects.forEach(function(s){s.units.forEach(function(u){if(u.id===id)r={u:u,s:s,g:g};});});});return r;}

var toastT;
function toast(t){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},2600);}

/* ---------- render ---------- */
function render(){
  fixView();renderBanner();renderAcct();renderSwitch();renderTabs();
  $('#vGarden').hidden=UI.page!=='garden';$('#vSyl').hidden=UI.page!=='syllabus';
  if(UI.page==='garden'){renderStage();renderHud();}else{renderSyl();}
}
function renderSwitch(){
  $('#switch').innerHTML=['garden','syllabus'].map(function(p){return '<button class="sw" type="button" data-a="page" data-p="'+p+'" aria-current="'+(UI.page===p)+'">'+(p==='garden'?'Garden':'Syllabus')+'</button>';}).join('');

/* ---------- import ---------- */
var DONE=/^(1|y|yes|true|done|x|✓|✔|complete|completed|finished|bloom|bloomed)$/i;
function parseDelimited(text){
  var first=text.split('\n')[0],d=first.indexOf('\t')>=0?'\t':(first.split(';').length>first.split(',').length?';':',');
  var rows=[],row=[],cur='',q=false,i,c;
  for(i=0;i<text.length;i++){c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=c;}
  row.push(cur);rows.push(row);return rows;
}
function matchKind(v){
  var n=String(v||'').toLowerCase().replace(/[^a-z]/g,'');if(!n)return null;
  var ks=Object.keys(KINDS),i;
  for(i=0;i<ks.length;i++){if(ks[i].toLowerCase()===n||KINDS[ks[i]].l.toLowerCase().replace(/[^a-z]/g,'')===n)return ks[i];}
  for(i=0;i<ks.length;i++){if(KINDS[ks[i]].f===n||KINDS[ks[i]].f+'s'===n)return ks[i];}
  return null;
}
function toRows(table,defG){
  var t=table.map(function(r){return r.map(function(c){return String(c==null?'':c).trim();});}).filter(function(r){return r.some(function(c){return c;});});
  if(!t.length)return [];
  var gi=-1,si=0,ui=1,di=-1,fi=-1,ti=-1,start=0,h=t[0].map(function(c){return c.toLowerCase();});
  function find(re){for(var i=0;i<h.length;i++)if(re.test(h[i]))return i;return -1;}
  var hs=find(/subject|module|paper|course/),hu=find(/unit|topic|chapter|lesson/);
  if(hs>=0&&hu>=0&&hs!==hu){si=hs;ui=hu;gi=find(/garden|degree|program|plot/);ti=find(/deadline|due|date|by/);di=find(/done|status|complete|finish|bloom/);fi=find(/flower/);start=1;if(gi===si||gi===ui)gi=-1;}
  else if(t[0].length>=3){gi=0;si=1;ui=2;ti=3;di=4;fi=5;}
  var lg=defG,ls='',out=[];
  for(var r=start;r<t.length;r++){var row=t[r];
    if(gi>=0&&row[gi])lg=row[gi];if(row[si])ls=row[si];
    var u=row[ui];if(!u)continue;
    var dv=di>=0?row[di]:'';
    out.push({g:lg,s:ls||'Subject',u:u,done:dv?DONE.test(dv):undefined,kind:fi>=0?matchKind(row[fi]):null,due:ti>=0?parseDate(row[ti]):null});}
  return out;
}
function buildImport(sources){
  var rows=[];sources.forEach(function(src){rows=rows.concat(toRows(src.rows,src.name));});
  if(!rows.length)return {err:'No units found. Check that the sheet has a header row with Subject and Unit columns.'};
  var gs=[];
  rows.forEach(function(r){
    var g=gs.filter(function(x){return x.name.toLowerCase()===r.g.toLowerCase();})[0];if(!g){g={name:r.g,subjects:[]};gs.push(g);}
    var s=g.subjects.filter(function(x){return x.name.toLowerCase()===r.s.toLowerCase();})[0];if(!s){s={name:r.s,units:[]};g.subjects.push(s);}
    s.units.push({name:r.u,done:r.done,kind:r.kind,due:r.due});
  });
  return {gardens:gs};
}
function handleFiles(files){
  if(!files||!files.length)return;
  var f=files[0],ext=(f.name.split('.').pop()||'').toLowerCase(),base=f.name.replace(/\.[^.]+$/,''),rd=new FileReader();
  function fail(m){UI.imp={err:m};refreshModal();}
  if(ext==='csv'||ext==='tsv'||ext==='txt'){
    rd.onload=function(){UI.imp=buildImport([{name:base,rows:parseDelimited(String(rd.result))}]);refreshModal();};
    rd.onerror=function(){fail('That file could not be read.');};rd.readAsText(f);
  }else{
    if(!window.XLSX){fail('Excel reading is not available right now. Save the sheet as CSV and choose that file instead.');return;}
    rd.onload=function(){
      try{var wb=XLSX.read(rd.result,{type:'array',cellDates:true,dateNF:'yyyy-mm-dd'}),src=wb.SheetNames.map(function(n){
        return {name:wb.SheetNames.length>1?n:base,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:'',dateNF:'yyyy-mm-dd'})};});
        UI.imp=buildImport(src);refreshModal();}
      catch(err){fail('That Excel file could not be read. Try saving it as CSV.');}
    };
    rd.onerror=function(){fail('That file could not be read.');};rd.readAsArrayBuffer(f);
  }
}
function applyImport(list,replace){
  if(replace)S.gardens=[];else S.gardens=S.gardens.filter(function(g){return !g.sample;});
  var touched=[],nu=0;
  list.forEach(function(ig){
    var g=S.gardens.filter(function(x){return x.name.toLowerCase()===ig.name.toLowerCase();})[0];
    if(!g){g=newGarden(ig.name);S.gardens.push(g);}
    if(touched.indexOf(g.id)<0)touched.push(g.id);
    ig.subjects.forEach(function(is){
      var s=g.subjects.filter(function(x){return x.name.toLowerCase()===is.name.toLowerCase();})[0];
      if(!s){s={id:uid(),name:is.name,units:[]};g.subjects.push(s);}
      is.units.forEach(function(iu){
        var u=s.units.filter(function(x){return x.name.toLowerCase()===iu.name.toLowerCase();})[0];
        if(!u){u=addUnit(g,s,iu.name,!!iu.done,iu.kind,iu.due);nu++;}
        else{if(iu.done!==undefined)u.done=iu.done;if(iu.kind)u.kind=iu.kind;if(iu.due)u.due=iu.due;}
      });
    });
  });
  S.view=touched.length===1?touched[0]:'all';UI.imp=null;UI.sel=null;save();render();renderModal();toast('Planted '+nu+' new units');
}

/* ---------- accounts and sharing (Supabase) ---------- */
function cfg(){var c=window.GARDEN_CONFIG||{};return (c.supabaseUrl&&c.supabaseAnonKey&&window.supabase)?c:null;}
function getShareQ(){try{return new URLSearchParams(location.search).get('share');}catch(e){return null;}}
function randTok(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function shareUrl(){return location.origin+location.pathname+'?share='+R.token;}
function setStatus(t){R.status=t;var el=$('#acctStatus');if(el)el.textContent=t;}
function renderAcct(){
  var el=$('#acct'),c=cfg(),h='';
  if(c&&!RO){
    if(USER)h='<span class="who" title="'+esc(USER.email||'')+'">'+esc(USER.email||'Signed in')+'</span><span class="who" id="acctStatus" aria-live="polite">'+esc(R.status)+'</span><button class="btn" type="button" data-a="share">Share</button><button class="btn" type="button" data-a="logout">Log out</button>';
    else h='<button class="btn pink" type="button" data-a="login">Log in or sign up</button>';
  }
  el.innerHTML=h;
}
function payload(){return {gardens:S.gardens,view:S.view,rot:S.rot};}
function pushNow(){
  if(!USER||!SB)return Promise.resolve();
  return SB.from('garden_data').upsert({user_id:USER.id,data:payload(),updated_at:new Date().toISOString()}).then(function(r){
    setStatus(r&&r.error?'Not saved. Check your connection.':'Saved');return r;});
}
function scheduleRemote(){clearTimeout(R.t);setStatus('Saving…');R.t=setTimeout(function(){R.t=null;pushNow();},900);}
document.addEventListener('visibilitychange',function(){if(document.hidden&&R.t){clearTimeout(R.t);R.t=null;pushNow();}});
function pullRemote(){
  var me=USER;
  SB.from('garden_data').select('data,share_token').eq('user_id',me.id).maybeSingle().then(function(r){
    if(USER!==me)return;
    if(r.error){setStatus('Could not load your garden. Check your connection.');return;}
    var d=r.data&&r.data.data;
    if(d&&Array.isArray(d.gardens)){
      S.gardens=d.gardens;S.view=d.view||'all';S.rot=d.rot!==false;R.token=r.data.share_token||null;UI.sel=null;
      writeLocal();render();setStatus('Saved');toast('Welcome back');
    }else{R.token=null;writeLocal();pushNow().then(function(){toast('Account ready. Your garden is saved.');});}
  });
}
function handleSession(user){
  var prev=USER;
  if(user&&prev&&user.id===prev.id){USER=user;return;}
  USER=user;
  if(user){renderAcct();closeAuth();pullRemote();}
  else if(prev){clearTimeout(R.t);R.t=null;R.token=null;R.status='';$('#modal').hidden=true;S.gardens=[];S.view='all';load();UI.sel=null;render();toast('Logged out');}
  else renderAcct();
}
function roMsg(t){var b=$('#roBanner');b.hidden=false;b.innerHTML='<span>'+esc(t)+'</span><a class="btn small pink" href="'+esc(location.pathname)+'">Make your own garden</a>';}
function loadShared(q){
  RO=true;document.body.classList.add('ro');S.gardens=[];render();
  SB.rpc('get_shared_garden',{t:q}).then(function(r){
    var d=r&&r.data;
    if(!r||r.error||!d||!Array.isArray(d.gardens)){roMsg('This share link is not active. Ask the owner for a new one.');return;}
    S.gardens=d.gardens;S.rot=d.rot!==false;S.view=S.gardens.length===1?S.gardens[0].id:'all';
    roMsg('You are viewing a shared garden. It is view only.');render();
  });
}
function initCloud(){
  var c=cfg(),q=getShareQ();
  if(!c){if(q)toast('Sharing needs the online version of this site');return;}
  SB=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);
  if(q){loadShared(q);return;}
  SB.auth.onAuthStateChange(function(ev,session){
    setTimeout(function(){if(ev==='PASSWORD_RECOVERY')openAuth('newpw');handleSession(session?session.user:null);},0);
  });
}
function tabShare(){
  if(!USER)return '<p>Log in to share your garden.</p>';
  var h='<p>Make a view-only link. Anyone who has it can see your gardens and syllabus. They cannot change anything and they do not see your email. Turn it off whenever you like.</p>';
  if(R.token)h+='<label class="field">Your link<input type="text" id="shareUrl" readonly value="'+esc(shareUrl())+'"></label><div class="actions"><button class="btn pink" type="button" data-a="copyshare">Copy link</button><button class="btn" type="button" data-a="newshare">Make a new link</button><button class="btn danger" type="button" data-a="stopshare">Turn off link</button></div><p>Making a new link stops the old one from working.</p>';
  else h+='<div class="actions"><button class="btn pink" type="button" data-a="mkshare">Create link</button></div>';
  return h;
}
/* auth dialog */
function openAuth(mode){UI.auth=mode||'login';$('#auth').hidden=false;renderAuth();setTimeout(function(){var i=$('#aEmail')||$('#aPw');if(i)i.focus();},30);}
function closeAuth(){$('#auth').hidden=true;}
$('#aClose').addEventListener('click',closeAuth);
$('#auth').addEventListener('mousedown',function(e){if(e.target===this)closeAuth();});
function renderAuth(){
  var m=UI.auth,c=cfg()||{},tabs='';
  if(m==='login'||m==='signup')tabs=[['login','Log in'],['signup','Sign up']].map(function(t){return '<button class="mt" type="button" role="tab" data-a="atab" data-t="'+t[0]+'" aria-selected="'+(m===t[0])+'">'+t[1]+'</button>';}).join('');
  $('#aTabs').innerHTML=tabs;
  $('#aTitle').textContent=m==='newpw'?'new-password.exe':m==='reset'?'reset.exe':'login.exe';
  var h='<form id="aForm" style="display:flex;flex-direction:column;gap:12px" novalidate>';
  if(m==='reset')h+='<p>Enter your email and we will send you a link to choose a new password.</p>';
  if(m==='newpw')h+='<p>Choose a new password.</p>';
  if(m!=='newpw')h+='<label class="field">Email<input type="email" id="aEmail" autocomplete="email" inputmode="email"></label>';
  if(m!=='reset')h+='<label class="field">'+(m==='newpw'?'New password':'Password')+'<input type="password" id="aPw" autocomplete="'+(m==='login'?'current-password':'new-password')+'"></label>';
  if(m==='signup'||m==='newpw')h+='<p>Use at least 8 characters.</p>';
  h+='<div class="actions"><button class="btn pink" type="submit" id="aGo">'+({login:'Log in',signup:'Create my account',reset:'Send reset link',newpw:'Save password'}[m])+'</button>';
  if(m==='login'&&c.passwordResetEmail)h+='<button class="btn small" type="button" data-a="areset">Forgot password?</button>';
  if(m==='reset')h+='<button class="btn small" type="button" data-a="aback">Back to log in</button>';
  h+='</div><div id="aMsg" aria-live="polite"></div></form>';
  $('#aBody').innerHTML=h;
}
function amsg(t,ok){$('#aMsg').innerHTML='<div class="fmsg'+(ok?' ok':'')+'">'+esc(t)+'</div>';}
function friendly(m){
  m=String(m||'');
  if(/invalid login/i.test(m))return 'That email and password do not match.';
  if(/already registered|already been registered/i.test(m))return 'That email already has an account. Log in instead.';
  if(/not confirmed/i.test(m))return 'Please confirm your email first. Check your inbox for the link.';
  if(/rate limit|too many/i.test(m))return 'Too many tries. Wait a few minutes and try again.';
  if(/password/i.test(m)&&/(short|least|weak)/i.test(m))return 'Use at least 8 characters for the password.';
  if(/valid email|invalid email/i.test(m))return 'Enter a valid email address.';
  return 'Something went wrong. '+m;
}
$('#aTabs').addEventListener('click',function(e){var b=e.target.closest('[data-a="atab"]');if(b){UI.auth=b.dataset.t;renderAuth();}});
$('#aBody').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='areset'){UI.auth='reset';renderAuth();}else if(b.dataset.a==='aback'){UI.auth='login';renderAuth();}});
$('#aBody').addEventListener('submit',function(e){
  e.preventDefault();if(!SB)return;
  var m=UI.auth,em=$('#aEmail')?$('#aEmail').value.trim():'',pw=$('#aPw')?$('#aPw').value:'',go=$('#aGo');
  if(m!=='newpw'&&!/^\S+@\S+\.\S+$/.test(em)){amsg('Enter a valid email address.');return;}
  if((m==='signup'||m==='newpw')&&pw.length<8){amsg('Use at least 8 characters for the password.');return;}
  if(m==='login'&&!pw){amsg('Enter your password.');return;}
  go.disabled=true;var back=location.origin+location.pathname,p;
  if(m==='login')p=SB.auth.signInWithPassword({email:em,password:pw}).then(function(r){if(r.error)amsg(friendly(r.error.message));});
  else if(m==='signup')p=SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:back}}).then(function(r){
    if(r.error)amsg(friendly(r.error.message));
    else if(!r.data||!r.data.session)amsg('Almost there. Check your email for a confirmation link, then log in.',true);});
  else if(m==='reset')p=SB.auth.resetPasswordForEmail(em,{redirectTo:back}).then(function(r){if(r.error)amsg(friendly(r.error.message));else amsg('If that email has an account, a reset link is on its way.',true);});
  else p=SB.auth.updateUser({password:pw}).then(function(r){if(r.error)amsg(friendly(r.error.message));else{closeAuth();toast('Password updated');}});
  p.then(function(){go.disabled=false;},function(){go.disabled=false;amsg('Could not reach the server. Check your connection.');});
});

if(!getShareQ()||!cfg())load();
render();initCloud();
})();
</script>
